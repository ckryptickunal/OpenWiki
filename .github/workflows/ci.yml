name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: python -m pytest
      - name: CLI smoke test
        run: |
          openwiki --version
          openwiki init --root /tmp/ws
          openwiki text README.md --root /tmp/ws --folder Notes
          openwiki ingest --root /tmp/ws --all --analysis-file examples/demo-talk.analysis.json
          openwiki lint --root /tmp/ws --fix-index --strict
