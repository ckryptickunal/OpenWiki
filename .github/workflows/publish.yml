name: Publish to PyPI

# Publishes openwiki-cli with PyPI trusted publishing: no API token is stored anywhere.
# One-time setup on pypi.org (Account settings > Publishing > Add a pending publisher):
#   PyPI project name: openwiki-cli   Owner: ckryptickunal   Repository: OpenWiki
#   Workflow name: publish.yml        Environment: pypi
# Then run this workflow from the Actions tab (Run workflow) on the tag you want to publish.

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build twine
      - run: python -m build
      - run: twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
